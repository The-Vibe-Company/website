name: IndexNow

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

concurrency:
  group: indexnow-${{ github.event.deployment.sha }}
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-bun-resilient

      # Vercel supplies a SHA in deployment.ref, not the branch name.
      # Establish the equivalent production + main guard before running code.
      - name: Verify deployment belongs to main
        id: main
        env:
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
        run: |
          if git merge-base --is-ancestor "$DEPLOYED_SHA" origin/main; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "IndexNow: skipped (not production main)"
          fi

      - name: Notify changed canonical URLs after production is live
        if: steps.main.outputs.verified == 'true'
        env:
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_REF: main
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/indexnow.ts --deployment
