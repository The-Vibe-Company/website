name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  content:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-resilient

      - name: Validate Victor's Story articles
        run: bun run content:victor-check

      - name: Validate Focus articles
        run: bun run content:focus-check

      - name: Validate article translations
        run: bun run content:translations-check

      - name: Validate unique article covers
        run: bun run content:covers-check

  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-resilient

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('package.json', 'next.config.ts', 'src/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-

      # Bun default discovery excludes the hidden .github directory.
      - name: Test resilient Bun setup
        run: bun test ./.github/actions/setup-bun-resilient/action.test.ts

      - name: Unit tests
        run: bun run test

      - name: Typecheck performance guardrails
        run: bun run perf:typecheck

      - name: Check image budgets
        run: bun run images:check

      - name: Build
        run: bunx next build --experimental-build-mode compile
